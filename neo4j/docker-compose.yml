version: '3.8'
services:
  neo4j:
    image: neo4j:5.22.0-enterprise
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/test1234
      - NEO4J_dbms_security_auth__minimum__password__length=8
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_default__advertised__address=localhost
      - NEO4J_dbms_databases_default__to__read__only=false
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./plugins:/plugins
      - ./seed:/seed
      - ./init:/init
      - ./init/neo4j.conf:/config/neo4j.conf
    command: ["bash","-lc","cp /config/neo4j.conf /var/lib/neo4j/conf/neo4j.conf && /startup/docker-entrypoint.sh neo4j"]